name: Fixture gated pure deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx wrangler deploy --config dist/wrangler.json --name my-worker
