name: Deploy Cloudflare Worker

# Pure Worker code deploy — this workflow must never be able to touch the
# database. D1 migrations are applied through a separate, human-driven
# process, never as a deploy side effect, so the CI deploy token does not
# need (and must not have) the D1 Edit permission.
# scripts/deploy-workflow-safety.ts enforces this invariant both as a
# pre-deploy step below and independently in the Deploy Workflow Safety CI.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/liff/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - 'packages/update-engine/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'

jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Presence-only checks (booleans and repo Variables — no secret values
      # ever reach the log). Failing here, before anything is built or
      # deployed, is what keeps WORKER_NAME from silently falling back to a
      # placeholder Worker.
      - name: Verify required configuration
        env:
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME != '' }}
          HAS_D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID != '' }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}
        run: |
          ok=1
          [ "$HAS_CLOUDFLARE_API_TOKEN" = "true" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN is not configured"; ok=0; }
          [ "$HAS_CLOUDFLARE_ACCOUNT_ID" = "true" ] || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID is not configured"; ok=0; }
          [ "$HAS_D1_DATABASE_NAME" = "true" ] || { echo "::error::secret D1_DATABASE_NAME is not configured (needed to patch the built wrangler config)"; ok=0; }
          [ "$HAS_D1_DATABASE_ID" = "true" ] || { echo "::error::secret D1_DATABASE_ID is not configured (needed to patch the built wrangler config)"; ok=0; }
          [ -n "$WORKER_NAME" ] || { echo "::error::repository variable WORKER_NAME is not set — refusing to deploy to a placeholder Worker name"; ok=0; }
          [ "$WORKER_NAME" != "your-worker-name" ] || { echo "::error::repository variable WORKER_NAME is still the placeholder value"; ok=0; }
          case "$WORKER_NAME" in *[!a-z0-9-]*) echo "::error::WORKER_NAME may only contain lowercase letters, digits and hyphens (it is passed as a CLI arg)"; ok=0;; esac
          [ -n "$VITE_LIFF_ID" ] || { echo "::error::repository variable VITE_LIFF_ID is not set — the LIFF client would build without its LIFF ID"; ok=0; }
          [ -n "$VITE_CALENDAR_CONNECTION_ID" ] || { echo "::error::repository variable VITE_CALENDAR_CONNECTION_ID is not set — the booking UI would silently break"; ok=0; }
          [ "$ok" = "1" ]

      - run: pnpm install --frozen-lockfile

      # In-workflow copy of the deploy safety audit. The Deploy Workflow
      # Safety CI runs the same suite on every PR/push, so removing this
      # step does not remove the check.
      - name: Audit workflows for DB mutation paths
        run: pnpm exec tsx scripts/deploy-workflow-safety.ts

      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine build

      - name: Build Worker and LIFF assets
        run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - name: Patch wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          # Admin CORS config — set these as repo Variables when the admin panel
          # and the Worker API are on different origins (e.g. *.pages.dev admin
          # + *.workers.dev API). Baking them into the deployed config (vars)
          # means every deploy carries them, so they can't be silently dropped
          # the way a manually-set dashboard variable is on redeploy.
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          ADMIN_ALLOW_CROSS_SITE: ${{ vars.ADMIN_ALLOW_CROSS_SITE }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          test -n "$D1_DATABASE_ID"
          cd apps/worker
          sed -i \
            -e "s|\"account_id\":\"[^\"]*\"|\"account_id\":\"${CLOUDFLARE_ACCOUNT_ID}\"|g" \
            -e "s|\"database_name\":\"[^\"]*\"|\"database_name\":\"${D1_DATABASE_NAME}\"|g" \
            -e "s|\"database_id\":\"[^\"]*\"|\"database_id\":\"${D1_DATABASE_ID}\"|g" \
            dist/line_harness/wrangler.json
          # Fail if the substitution did not take (e.g. the built config's JSON
          # formatting changed), rather than silently deploying the dev binding.
          grep -q "\"database_id\":\"${D1_DATABASE_ID}\"" dist/line_harness/wrangler.json \
            || { echo "::error::wrangler.json D1 patch did not apply — refusing to deploy"; exit 1; }
          # Inject admin CORS vars into the deployed config when ADMIN_ORIGIN is
          # set. ADMIN_ALLOW_CROSS_SITE defaults to "true" (SameSite=None; Secure
          # cookies) since cross-origin admin/API is the case that needs it.
          if [ -n "$ADMIN_ORIGIN" ]; then
            tmp="$(mktemp)"
            jq --arg o "$ADMIN_ORIGIN" --arg x "$ADMIN_ALLOW_CROSS_SITE" --arg w "$WORKER_URL" '
              .vars.ADMIN_ORIGIN = $o
              | .vars.ADMIN_ALLOW_CROSS_SITE = (if $x == "" then "true" else $x end)
              | (if $w != "" then .vars.WORKER_URL = $w else . end)
            ' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
            echo "Patched admin CORS vars: ADMIN_ORIGIN=$ADMIN_ORIGIN ADMIN_ALLOW_CROSS_SITE=${ADMIN_ALLOW_CROSS_SITE:-true}"
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config dist/line_harness/wrangler.json --name ${{ vars.WORKER_NAME }}
